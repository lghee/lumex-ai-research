name: LUMEX public collector diagnosis (read only)
on:
  pull_request:
    paths:
      - .github/workflows/lumex-public-collector-diagnosis.yml
      - production/src/index.js
  workflow_dispatch:
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect deployed public collector metadata (never print secrets)
        env:
          BASE: https://lumex-ai-research2.kpiplus195.workers.dev
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          base=os.environ['BASE'].rstrip('/')
          for endpoint in ['health','market-hub/v1/health','market-hub/v1/live-health','market-hub/v1/public-pulse-health','market-hub/v1/binance-egress-health','market-hub/v1/github-binance-health','market-hub/v1/whale-health','market-hub/v1/legacy-backfill-health','market-hub/v1/archive-health']:
              try:
                  result=subprocess.run(['curl','--fail','--silent','--show-error',
                      '--location','--max-time','15',base+'/'+endpoint],
                      capture_output=True,text=True,timeout=20)
                  if result.returncode!=0: raise ValueError('curl_http_or_network_error_'+str(result.returncode))
                  x=json.loads(result.stdout[:100000])
                  if endpoint.endswith('live-health'):
                      x={'ok':x.get('ok'),'enabled':x.get('enabled'),'feeds':{k:{f:v.get(f) for f in ('connected','state','error','route','last_received_ms','packets','restarts') if f in v} for k,v in (x.get('feeds') or {}).items() if isinstance(v,dict)}}
                  elif endpoint.endswith('github-binance-health'):
                      x={k:x.get(k) for k in ('ok','reason','source','checked_ms','connected',
                         'provider_messages_accepted','accepted_this_request','total_accepted',
                         'last_accepted_ms','capture_confirmed','stale','cron_retirement_allowed',
                         'coverage','r2_archive','r2_source_proof_verified','r2_source_proof_key',
                         'r2_readback_verified','r2_last_observed_ms','source_session_stale',
                         'last_scheduled_ms','scheduled_session_proven','automatic_dispatch')}
                  elif endpoint.endswith('public-pulse-health'):
                      report=x.get('report') if isinstance(x.get('report'),dict) else {}
                      safe={k:report.get(k) for k in ('ok','code','completed_at','timestamp','generated_at','sources','checks','last_success_ms','last_success_unix','last_run_ms','last_error')}
                      x={'ok':x.get('ok'),'enabled':x.get('enabled'),'report':safe,'report_keys':list(report.keys())[:35]}
                  elif endpoint.endswith('binance-egress-health'):
                      x={'ok':x.get('ok'),'status':x.get('status'),'checked_ms':x.get('checked_ms'),
                         'handshake_http_status':x.get('handshake_http_status'),'cached':x.get('cached'),
                         'reason':x.get('reason'),'stale':x.get('stale'),
                         'cron_retirement_allowed':x.get('cron_retirement_allowed'),
                         'usable_as_liquidation_feed':x.get('usable_as_liquidation_feed')}
                  elif endpoint.endswith('whale-health'):
                      x={'ok':x.get('ok'),'enabled':x.get('enabled'),'source':x.get('source'),'last_run_ms':x.get('last_run_ms'),'last_success_ms':x.get('last_success_ms'),'last_error':x.get('last_error'),'watchlist':[{'backfill_complete':z.get('backfill_complete'),'gap_possible':z.get('gap_possible'),'last_checked_ms':z.get('last_checked_ms'),'error':z.get('error')} for z in (x.get('watchlist') or []) if isinstance(z,dict)]}
                  elif endpoint.endswith('legacy-backfill-health'):
                      x={'ok':x.get('ok'),'enabled':x.get('enabled'),'sources':[{'source':z.get('source'),'caught_up':z.get('caught_up'),'last_error':z.get('last_error'),'records_archived':z.get('records_archived'),'last_success_ms':z.get('last_success_ms')} for z in (x.get('sources') or []) if isinstance(z,dict)]}
                  elif endpoint.endswith('archive-health'):
                      x={'ok':x.get('ok'),'recent_liquidation_sample_verified':x.get('recent_liquidation_sample_verified'),'recent_whale_sample_verified':x.get('recent_whale_sample_verified'),'kinds':{k:{f:v.get(f) for f in ('sample_verified','reason','hours_with_object')} for k,v in (x.get('kinds') or {}).items() if isinstance(v,dict)}}
                  else:
                      x={'ok':x.get('ok'),'version':x.get('version')}
                  if endpoint.endswith('whale-health'):
                      x['completed_addresses']=sum(1 for z in x['watchlist'] if z['backfill_complete'] is True and z['gap_possible'] is False and not z['error'])
                      x['tracked_addresses']=len(x['watchlist'])
                  if endpoint.endswith('legacy-backfill-health'):
                      x['liquidations_completed']=next((z['caught_up'] for z in x['sources'] if z['source']=='liquidations'),None)
                  print(endpoint, json.dumps(x,ensure_ascii=False,separators=(',',':')))
              except Exception as e:
                  print(endpoint,'UNAVAILABLE',type(e).__name__,str(e)[:100])
          PY
      - name: Inspect actual Bybit public USDT kline and trade delivery (no tokens)
        run: |
          node --input-type=module <<'JS'
          // Read-only public market feed audit; no credentials, orders or Worker writes.
          const symbol='BTCUSDT',url='wss://stream.bybit.com/v5/public/linear';
          const result={handshake:false,subscribed:false,public_trades:0,klines:0,example_interval:null,
            last_trade_ms:null,last_candle_open_ms:null,orders_enabled:false};
          const ws=new WebSocket(url);
          await new Promise(resolve=>{
            let done=false;
            const finish=()=>{if(done)return;done=true;try{ws.close()}catch{}resolve()};
            const timer=setTimeout(finish,23000);
            ws.addEventListener('open',()=>{
              result.handshake=true;
              ws.send(JSON.stringify({op:'subscribe',args:['publicTrade.'+symbol,'kline.5.'+symbol]}));
            });
            ws.addEventListener('message',ev=>{
              if(typeof ev.data!=='string'||ev.data.length>300000)return;
              let j;try{j=JSON.parse(ev.data)}catch{return}
              if(j.op==='subscribe'&&j.success===true)result.subscribed=true;
              if(j.topic==='publicTrade.'+symbol&&Array.isArray(j.data)){
                result.public_trades+=j.data.length;
                const t=Number(j.data.at(-1)?.T);
                if(Number.isSafeInteger(t))result.last_trade_ms=t;
              }
              if(j.topic==='kline.5.'+symbol&&Array.isArray(j.data)){
                result.klines+=j.data.length;result.example_interval='5';
                const t=Number(j.data.at(-1)?.start);
                if(Number.isSafeInteger(t))result.last_candle_open_ms=t;
              }
              if(result.public_trades>0&&result.klines>0){clearTimeout(timer);finish();}
            });
            ws.addEventListener('error',()=>{clearTimeout(timer);finish()});
            ws.addEventListener('close',()=>{clearTimeout(timer);finish()});
          });
          console.log('bybit_prochart_public_feed',JSON.stringify(result));
          JS
      - name: Probe upstream Binance public WS handshake from separate GitHub network (read only)
        run: |
          node --input-type=module <<'JS'
          const urls=[
            'wss://fstream.binance.com/market/ws/!forceOrder@arr',
            'wss://fstream.binance.com/market/stream?streams=!forceOrder@arr',
            'wss://dstream.binance.com/ws/!forceOrder@arr'
          ];
          for(let i=0;i<urls.length;i++){
            const url=urls[i],result=await new Promise(resolve=>{
              let done=false,ws;
              const finish=(status)=>{if(done)return;done=true;try{ws?.close()}catch{}resolve(status)};
              const timer=setTimeout(()=>finish('timeout'),6000);
              try{ws=new WebSocket(url);
                ws.addEventListener('open',()=>{clearTimeout(timer);finish('connected')},{once:true});
                ws.addEventListener('error',()=>{clearTimeout(timer);finish('error')},{once:true});
                ws.addEventListener('close',e=>{clearTimeout(timer);finish('closed_'+e.code)},{once:true});
              }catch(e){clearTimeout(timer);finish(e.name||'constructor_error')}
            });
            console.log('upstream_binance_route_'+i, result);
          }
          JS
