name: LUMEX backtest candles (once, public data, read-only)
on:
  pull_request:
    paths:
      - 'tools/backtest/fetch_candles.py'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public USDT-perpetual candles (no keys)
        run: python tools/backtest/fetch_candles.py out
      - name: Commit data to this PR branch only (never main)
        run: |
          mkdir -p tools/backtest/data && cp out/* tools/backtest/data/ && gzip -9 tools/backtest/data/*.csv
          git config user.name "lumex-backtest-bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/backtest/data && git commit -m "data: backtest candles $(date -u +%FT%TZ)" && git push origin HEAD:${{ github.head_ref }}
