name: LUMEX Worker production deploy (automatic guarded Phase33)
on:
  push:
    branches: [main]
    paths:
      # Any deployed Worker runtime change is auto-released to Cloudflare after full safety checks.
      - 'production/src/**'
      - 'production/engine/**'
      - 'production/relay/**'
      - 'production/server.py'
      - 'production/Dockerfile'
      - 'production/wrangler.jsonc'
      - 'production/package.json'
      - '.github/workflows/lumex-worker-production-deploy.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_LUMEX_131 to manually deploy (main push deploys automatically)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmation == 'DEPLOY_LUMEX_131') }}
    runs-on: ubuntu-latest
    concurrency:
      group: lumex-cloudflare-worker-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LUMEX_WORKER_URL: ${{ vars.LUMEX_WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare deployment credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets. No deployment was attempted."
            exit 1
          fi
      - name: Install Worker development dependencies
        working-directory: production
        run: npm install --no-audit --no-fund
      - name: Reject images missing required Binance Python module before deployment
        working-directory: production
        run: python3 tests/test_container_image_packaging_20261119.py -v
      - name: Validate Worker JS and offline public-market regression tests
        working-directory: production
        run: npm run check:js
      - name: Deploy existing production Worker name and bindings
        working-directory: production
        shell: bash
        env:
          LUMEX_GITHUB_DISPATCH_TOKEN: ${{ secrets.LUMEX_GITHUB_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # Optional one-step upload of a repository-scoped Actions:write
          # dispatch token into the same Cloudflare Worker release.
          # Keep the existing manual-only production approval gate.
          if [[ -n "${LUMEX_GITHUB_DISPATCH_TOKEN:-}" ]]; then
            umask 077
            secrets_file="$(mktemp "${RUNNER_TEMP}/lumex-secret.XXXXXX.json")"
            trap 'rm -f "$secrets_file"' EXIT
            python3 - "$secrets_file" <<'PY'
          import json, os, sys
          token = os.environ.get('LUMEX_GITHUB_DISPATCH_TOKEN', '')
          if len(token) < 30:
              raise SystemExit('Dispatch secret is too short')
          with open(sys.argv[1], 'w', encoding='utf-8') as output:
              json.dump({'LUMEX_GITHUB_DISPATCH_TOKEN': token}, output)
          PY
            npx wrangler deploy --config wrangler.jsonc --secrets-file "$secrets_file"
          else
            npx wrangler deploy --config wrangler.jsonc
          fi
      - name: Verify public Worker versions from deployed endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="${LUMEX_WORKER_URL:-https://lumex-ai-research2.kpiplus195.workers.dev}"
          URL="${URL%/}"
          for endpoint in health market-hub/v1/health; do
            echo "Checking $URL/$endpoint"
            curl --fail --silent --show-error --location --max-time 30 "$URL/$endpoint" | python3 -c '
          import json,sys
          body=json.load(sys.stdin)
          assert body.get("ok") is True, body.get("error","not_ok")
          assert body.get("version") == "1.3.1", "expected 1.3.1, got "+str(body.get("version"))
          print("PASS deployed Worker",body["version"])
          '
          done
      - name: Verify Phase 33 private observer route refuses anonymous requests
        shell: bash
        run: |
          set -euo pipefail
          URL="${LUMEX_WORKER_URL:-https://lumex-ai-research2.kpiplus195.workers.dev}"
          status="$(curl --silent --show-error --max-time 25 --output /tmp/phase33-anon.json --write-out '%{http_code}' "${URL%/}/market-hub/v1/order-flow-live-health")"
          if [[ "$status" != 401 ]]; then
            echo "::error::Phase 33 anonymous observer must return HTTP 401, got $status"
            cat /tmp/phase33-anon.json
            exit 1
          fi
          echo "PASS Phase 33 private route rejects anonymous calls"
      - name: Inspect current Container image state without changing customer data
        shell: bash
        run: |
          set -euo pipefail
          URL="${LUMEX_WORKER_URL:-https://lumex-ai-research2.kpiplus195.workers.dev}"
          URL="${URL%/}"
          curl --fail --silent --show-error --max-time 25 "$URL/market-hub/v1/binance-container-image-health" |
            python3 -c '
          import json,sys
          p=json.load(sys.stdin)
          print("LUMEX_BINANCE_CONTAINER_IMAGE",json.dumps({
            "ok":p.get("ok"),"running":p.get("container_running"),
            "image_matches_current":p.get("image_matches_current"),
            "image_starting":p.get("image_starting")},sort_keys=True))
          if p.get("image_matches_current") is False:
              print("WARNING: running old Container image; next eligible Binance probe rotates it automatically")
          if p.get("ok") is not True:raise SystemExit("Image diagnostic route not available")
          '
      - name: Safe rollback reminder
        if: failure()
        run: |
          echo "::warning::Deployment or health verification failed. Do NOT stop any existing WordPress/cPanel market collection, trade or payment Cron. Verify actual Cloudflare Worker version and last stable deployment in Cloudflare dashboard."
