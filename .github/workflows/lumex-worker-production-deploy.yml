name: LUMEX Worker production deploy (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_LUMEX_131 to deploy Cloudflare Worker to production"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_LUMEX_131' }}
    runs-on: ubuntu-latest
    concurrency:
      group: lumex-cloudflare-worker-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LUMEX_WORKER_URL: ${{ vars.LUMEX_WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare deployment credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets. No deployment was attempted."
            exit 1
          fi
      - name: Install Worker development dependencies
        working-directory: production
        run: npm install --no-audit --no-fund
      - name: Validate Worker JS and offline public-market regression tests
        working-directory: production
        run: npm run check:js
      - name: Deploy existing production Worker name and bindings
        working-directory: production
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify public Worker versions from deployed endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="${LUMEX_WORKER_URL:-https://lumex-ai-research2.kpiplus195.workers.dev}"
          URL="${URL%/}"
          for endpoint in health market-hub/v1/health; do
            echo "Checking $URL/$endpoint"
            curl --fail --silent --show-error --location --max-time 30 "$URL/$endpoint" | python3 -c '
          import json,sys
          body=json.load(sys.stdin)
          assert body.get("ok") is True, body.get("error","not_ok")
          assert body.get("version") == "1.3.1", "expected 1.3.1, got "+str(body.get("version"))
          print("PASS deployed Worker",body["version"])
          '
          done
      - name: Safe rollback reminder
        if: failure()
        run: |
          echo "::warning::Deployment or health verification failed. Do NOT stop any existing WordPress/cPanel market collection, trade or payment Cron. Verify actual Cloudflare Worker version and last stable deployment in Cloudflare dashboard."
