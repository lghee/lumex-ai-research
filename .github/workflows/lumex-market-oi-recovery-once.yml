name: LUMEX market OI and liquidation recovery (one time)
on:
  push:
    branches: [main]
    paths:
      - 'production/deploy/oi-series-gate-repair-20261114.trigger'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: lumex-cloudflare-worker-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LUMEX_WORKER_URL: ${{ vars.LUMEX_WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require configured existing Cloudflare deployment secrets
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deploy credentials missing"; exit 1
          fi
      - name: Install Worker development dependencies
        working-directory: production
        run: npm install --no-audit --no-fund
      - name: Complete public market / research regression suite
        working-directory: production
        run: npm run check:js
      - name: Deploy existing named Worker, preserving existing R2 and secret bindings
        working-directory: production
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify actual deployed 1.3.1 endpoints
        shell: bash
        run: |
          set -euo pipefail
          URL="${LUMEX_WORKER_URL:-https://lumex-ai-research2.kpiplus195.workers.dev}"
          URL="${URL%/}"
          for endpoint in health market-hub/v1/health; do
            curl --fail --silent --show-error --max-time 30 "$URL/$endpoint" |
              python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True; assert x.get("version")=="1.3.1"; print("PASS live Worker 1.3.1")'
          done
      - name: Report live OI by symbol and 7/30-day window
        shell: bash
        run: |
          URL="${LUMEX_WORKER_URL:-https://lumex-ai-research2.kpiplus195.workers.dev}"
          URL="${URL%/}"
          curl --fail --silent --show-error --max-time 30 "$URL/market-hub/v1/oi-health" |
            python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          assert d.get("ok") is True
          report=d.get("report") or {}
          for key,v in sorted((report.get("sources") or {}).items()):
              print(key,"ok",v.get("ok"),"exchange",v.get("source"),"error",v.get("error"))
          print("Collection rotates 8 slots in 40 min. Do not call old failures resolved until each affected slot has rerun.")
          '
      - name: Show public Binance / Bybit / Gate live connection isolation
        shell: bash
        run: |
          URL="${LUMEX_WORKER_URL:-https://lumex-ai-research2.kpiplus195.workers.dev}"
          URL="${URL%/}"
          curl --fail --silent --show-error --max-time 30 "$URL/market-hub/v1/live-health" |
            python3 -c '
          import json,sys
          d=json.load(sys.stdin); assert d.get("ok") is True
          for name,x in (d.get("feeds") or {}).items():
              if name in ("bybit","gate","binance"):
                  print(name,"enabled",x.get("enabled"),"connected",x.get("connected"),"error",x.get("error"))
          '
      - name: Preserve cPanel collector/auto-trading Cron on failure
        if: failure()
        run: echo "::warning::Keep all WP/cPanel market and private trading/payment Cron; investigate Cloudflare deployment/health before any cutover."
