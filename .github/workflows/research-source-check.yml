name: LUMEX Research source checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python research dependencies
        run: python -m pip install -r production/engine/requirements.txt
      - name: Worker, engine and offline simulator tests
        run: cd production && npm run check
