name: LUMEX Phase33 live R2 observed trade freshness audit
on:
  workflow_run:
    workflows:
      - LUMEX Worker production deploy (automatic guarded Phase33)
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumex-phase33-observed-minute-audit
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require read-only R2 credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Allow updated Durable Object code to load
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 70
      - name: Install Wrangler
        working-directory: production
        run: npm install --no-audit --no-fund
      - name: Read closed Gate WebSocket minute snapshots
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/flow-observed
          for offset in $(seq 1 15); do
            t="$(date -u -d "$offset minutes ago" +%s)"
            minute="$((t / 60 * 60000))"
            day="$(date -u -d "@$((minute / 1000))" +%Y-%m-%d)"
            dest="/tmp/flow-observed/${minute}.json"
            npx wrangler r2 object get "lumex-ai-data/market-hub/order-flow/v1/live/gate/${day}/${minute}.json" --file "$dest" --remote >/dev/null 2>&1 || rm -f "$dest"
          done
      - name: Read independent private collector status
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object get 'lumex-ai-data/market-hub/order-flow/v1/live/gate/status.json' --file /tmp/flow-observer-status.json --remote >/dev/null 2>&1 || {
            rm -f /tmp/flow-observer-status.json
            echo "::warning::Gate collector status unavailable"
          }
      - name: Read precise futures REST standby R2 objects
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/flow-futures-standby
          if [[ -s /tmp/flow-observer-status.json ]]; then
            for symbol in BTC ETH SOL XRP; do
              ms="$(jq -r --arg s "$symbol" '.futures_rest_standby.cursor[$s] // empty' /tmp/flow-observer-status.json)"
              if [[ "$ms" =~ ^[0-9]{13}$ ]]; then
                day="$(date -u -d "@$((ms / 1000))" +%Y-%m-%d)"
                key="lumex-ai-data/market-hub/order-flow/v1/live/gate/futures-rest-standby/v1/${day}/${symbol}/${ms}.json"
                npx wrangler r2 object get "$key" --file "/tmp/flow-futures-standby/${symbol}.json" --remote >/dev/null 2>&1 || rm -f "/tmp/flow-futures-standby/${symbol}.json"
              fi
            done
          fi
      - name: Fail closed for unavailable, stale, mixed or synthetic market data
        run: |
          python3 production/scripts/order-flow-live-audit.py \
            --dir /tmp/flow-observed \
            --status /tmp/flow-observer-status.json \
            --standby-dir /tmp/flow-futures-standby
      - name: Publish collection proof without claiming full exchange coverage
        if: always()
        run: |
          if test -s /tmp/lumex-flow-proof.md; then
            cat /tmp/lumex-flow-proof.md >> "$GITHUB_STEP_SUMMARY"
          fi
