name: LUMEX Phase33 live R2 observed trade freshness audit
on:
  workflow_run:
    workflows:
      - LUMEX Worker production deploy (automatic guarded Phase33)
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumex-phase33-observed-minute-audit
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure read-only R2 credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Allow bounded Durable Object code turnover after a successful deploy
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          # Code update max_delay 60s + collector status heartbeat every 20s.
          # The R2 read below takes additional time; no data is fabricated.
          sleep 70
      - name: Install Wrangler
        working-directory: production
        run: npm install --no-audit --no-fund
      - name: Read recent immutable Gate observer minute snapshots (no writes)
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/flow-observed
          for offset in $(seq 1 15); do
            t="$(date -u -d "$offset minutes ago" +%s)"
            minute="$(( t / 60 * 60000 ))"
            day="$(date -u -d "@$((minute/1000))" +%Y-%m-%d)"
            dest="/tmp/flow-observed/${minute}.json"
            npx wrangler r2 object get "lumex-ai-data/market-hub/order-flow/v1/live/gate/${day}/${minute}.json" --file "$dest" --remote >/dev/null 2>&1 || rm -f "$dest"
          done
      - name: Get independent collector heartbeat (diagnostic only)
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object get 'lumex-ai-data/market-hub/order-flow/v1/live/gate/status.json' --file /tmp/flow-observer-status.json --remote >/dev/null 2>&1 || {
            rm -f /tmp/flow-observer-status.json
            echo "::warning::No collector heartbeat in R2: scheduler or Durable Object may not be running"
          }
      - name: Read actual Gate REST standby evidence when futures stream is degraded
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/flow-futures-standby
          if test -s /tmp/flow-observer-status.json; then
            python3 - <<'PY' > /tmp/futures-standby-keys.tsv
          import datetime,json
          try:
              h=json.load(open('/tmp/flow-observer-status.json',encoding='utf-8'))
              cursors=(h.get('futures_rest_standby') or {}).get('cursor') or {}
              for symbol in ('BTC','ETH','SOL','XRP'):
                  value=cursors.get(symbol)
                  if type(value) is not int or value<=0 or value%10000:continue
                  day=datetime.datetime.fromtimestamp(value/1000,datetime.timezone.utc).strftime('%Y-%m-%d')
                  key=f'market-hub/order-flow/v1/live/gate/futures-rest-standby/v1/{day}/{symbol}/{value}.json'
                  print(symbol+'\t'+key)
          except (OSError,ValueError,TypeError,KeyError):
              pass
          PY
            while IFS=        run: python3 production/scripts/order-flow-live-audit.py --dir /tmp/flow-observed --status /tmp/flow-observer-status.json --standby-dir /tmp/flow-futures-standby
      - name: Publish honest proof report
        if: always()
        run: |
          if test -s /tmp/lumex-flow-proof.md; then cat /tmp/lumex-flow-proof.md >> "$GITHUB_STEP_SUMMARY"; fi
\t' read -r symbol key; do
              test -n "$symbol" || continue
              npx wrangler r2 object get "lumex-ai-data/$key" --file "/tmp/flow-futures-standby/$symbol.json" --remote >/dev/null 2>&1 || rm -f "/tmp/flow-futures-standby/$symbol.json"
            done < /tmp/futures-standby-keys.tsv
          fi
      - name: Reject blank, stale, malformed or synthetic observations
        run: python3 production/scripts/order-flow-live-audit.py --dir /tmp/flow-observed --status /tmp/flow-observer-status.json
      - name: Publish honest proof report
        if: always()
        run: |
          if test -s /tmp/lumex-flow-proof.md; then cat /tmp/lumex-flow-proof.md >> "$GITHUB_STEP_SUMMARY"; fi
