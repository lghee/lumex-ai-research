name: LUMEX phase8 live public source verification
on:
  pull_request:
    paths:
      - '.github/workflows/lumex-phase8-live-source-verification.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify-data-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read only official macro source coverage and Binance stream status
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, time, datetime
          root="https://lumex-ai-research2.kpiplus195.workers.dev/market-hub/v1/"
          paths=["official-news","binance-external-health","github-binance-health",
                 "lyra-paper-health","public-heatmap"]
          for path in paths:
              result={"endpoint":path,"at":datetime.datetime.now(datetime.timezone.utc).isoformat()}
              for i in range(3):
                  try:
                      url=root+path+"?phase8read="+str(int(time.time()))
                      req=urllib.request.Request(url,headers={"Accept":"application/json",
                          "User-Agent":"LUMEX-phase8-official-read-only/1.0"})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          data=json.load(r);result["http"]=r.status
                      result["ok"]=data.get("ok")
                      if path=="official-news":
                          result["feed_states"]=[{"id":x.get("id"),"status":x.get("status"),"items":x.get("items")}
                              for x in data.get("feeds",[])]
                          result["sources"]=data.get("coverage")
                          result["items_by_source"]={k:sum(x.get("source_id")==k for x in data.get("items",[]))
                              for k in ("fed","bea","bls_cpi","bls_jobs")}
                      elif path=="binance-external-health":
                          for k in ("configured","connected","stale","verified_contiguous_seconds",
                                    "source_r2_readback_verified","reason"):
                              if k in data:result[k]=data[k]
                      elif path=="github-binance-health":
                          for k in ("reason","coverage","configured","ok"): 
                              if k in data:result[k]=data[k]
                      elif path=="lyra-paper-health":
                          for k in ("initialized","state","last_observed_ms"):result[k]=data.get(k)
                      elif path=="public-heatmap":
                          result["n"]=len(data.get("coins",[]));result["stale"]=data.get("stale")
                      break
                  except urllib.error.HTTPError as e:
                      result["http"]=e.code
                      result["error"]="HTTP error from edge or origin"
                  except Exception as e:
                      result["error"]=type(e).__name__
                  if i<2:time.sleep(6)
              print("LUMEX_PHASE8_LIVE_PROOF "+json.dumps(result,ensure_ascii=False))
          PY
      - name: Read BLS sidecar's actual GitHub run history (no secrets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          url='https://api.github.com/repos/lghee/lumex-ai-research/actions/workflows/lumex-official-bls-sidecar.yml/runs?per_page=8'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'X-GitHub-Api-Version':'2022-11-28','User-Agent':'LUMEX-phase8-source-proof'})
          try:
            with urllib.request.urlopen(req,timeout=14) as r:d=json.load(r)
            print('LUMEX_BLS_GITHUB_RUNS '+json.dumps([{'id':x.get('id'),'status':x.get('status'),
              'conclusion':x.get('conclusion'),'event':x.get('event'),'created_at':x.get('created_at')}
              for x in d.get('workflow_runs',[])[:8]],ensure_ascii=False))
          except Exception as e: print('LUMEX_BLS_GITHUB_RUNS_UNAVAILABLE '+type(e).__name__)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumex-phase8-collector-sources
          path: |
            production/src/official-news.mjs
            production/src/bls-official-sidecar.mjs
            production/src/index.js
            production/scripts/bls-official-sidecar.py
            production/tests/test_bls_atom_sidecar.py
            production/tests/test_bls_official_oidc_20261119.mjs
            production/relay/binance-public-relay.mjs
            production/relay/relay-healthcheck.mjs
            production/relay/Dockerfile
            production/relay/compose.yml
            production/relay/.env.example
            production/relay/README_KO.md
            production/relay/.gitignore
            production/tests/test_binance_relay_deploy_20261119.mjs
            .github/workflows/lumex-official-bls-sidecar.yml
          retention-days: 14
