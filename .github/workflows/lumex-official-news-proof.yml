name: LUMEX official macro source production proof
on:
  pull_request:
    paths:
      - '.github/workflows/lumex-official-news-proof.yml'
permissions:
  contents: read
jobs:
  verified-headlines:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify official macro R2 archive after production Worker cron
        run: |
          python3 - <<'PY'
          import datetime,json,time,urllib.request
          url='https://lumex-ai-research2.kpiplus195.workers.dev/market-hub/v1/official-news'
          for i in range(22):
              try:
                  req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'LUMEX-official-proof'})
                  with urllib.request.urlopen(req,timeout=20) as resp: d=json.load(resp)
                  assert d.get('schema')=='lumex_public_official_news_v1'
                  assert d.get('ok') is True and d.get('no_news_inference') is True
                  assert d.get('no_order_execution') is True
                  items=d.get('items') or []
                  assert len(items)>0 and d.get('coverage',{}).get('verified_feeds',0)>=1
                  hosts={'fed':['www.federalreserve.gov'],'bls_cpi':['www.bls.gov'],
                         'bls_jobs':['www.bls.gov'],'bea':['www.bea.gov','apps.bea.gov']}
                  from urllib.parse import urlparse
                  for row in items:
                      u=urlparse(row['source_url'])
                      assert u.scheme=='https' and u.hostname in hosts[row['source_id']]
                      assert row['official_source_verified'] is True
                  print('LUMEX_OFFICIAL_MACRO_PROOF '+json.dumps({
                      'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      'count':len(items),'verified_feeds':d['coverage']['verified_feeds'],
                      'attempted':d['coverage']['attempted_feeds'],
                      'source_states':[{'id':x['id'],'status':x['status'],'count':x.get('items')} for x in d['feeds']],
                      'headlines':[{'agency':x['agency'],'published_utc':x['published_utc'],'title':x['title_original'][:95]} for x in items[:4]]
                  },ensure_ascii=False))
                  break
              except Exception as error:
                  print('official_proof_pending',i+1,str(error).replace('\n',' ')[:120])
                  if i==21:raise SystemExit('NO_VERIFIED_OFFICIAL_HEADLINES_YET')
                  time.sleep(14)
          PY
