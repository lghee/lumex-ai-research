name: LUMEX backtest 1m candles (once, public data, read-only)
on:
  push:
    branches:
      - 'data/backtest-1m-20261126'
    paths:
      - 'tools/backtest/fetch_1m.py'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch 1-minute USDT-perpetual candles (no keys)
        run: python tools/backtest/fetch_1m.py out
      - name: Commit data to this data branch only (never main)
        run: |
          mkdir -p tools/backtest/data1m && cp out/* tools/backtest/data1m/ && gzip -9f tools/backtest/data1m/*.csv
          git config user.name "lumex-backtest-bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/backtest/data1m && git commit -m "data: 1m candles $(date -u +%FT%TZ)" && git push origin HEAD:${{ github.ref_name }}
