name: LUMEX public market provider continuity fix (once)
on:
  push:
    branches: [main]
    paths:
      - 'production/deploy/market-gate-liq-oi-priority-20261114.trigger'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: lumex-cloudflare-worker-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LUMEX_WORKER_URL: ${{ vars.LUMEX_WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Cloudflare credentials
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Deployment credentials not configured"; exit 1
          fi
      - name: Install development dependencies
        working-directory: production
        run: npm install --no-audit --no-fund
      - name: Full Worker source and market regression suite
        working-directory: production
        run: npm run check:js
      - name: Deploy existing Worker and bindings
        working-directory: production
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify live Worker and source-isolated provider status
        shell: bash
        run: |
          set -euo pipefail
          URL="${LUMEX_WORKER_URL:-https://lumex-ai-research2.kpiplus195.workers.dev}"
          URL="${URL%/}"
          curl --fail --silent --show-error --max-time 30 "$URL/market-hub/v1/health" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("version")=="1.3.1"; print("PASS deployed Market Hub 1.3.1")'
          curl --fail --silent --show-error --max-time 30 "$URL/market-hub/v1/live-health" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; print("Streams",[(k,x.get("enabled"),x.get("connected"),x.get("error")) for k,x in (d.get("feeds") or {}).items()])'
          curl --fail --silent --show-error --max-time 30 "$URL/market-hub/v1/oi-health" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); src=(d.get("report") or {}).get("sources") or {}; print("OI", [(k,v.get("ok"),v.get("source"),v.get("priority_recovery"),v.get("error")) for k,v in sorted(src.items())]); print("An old failed slot is only recovered once its Cron runs after deployment")'
      - name: Preserve all cPanel source, live-order and billing Cron
        if: failure()
        run: echo "::warning::Never stop old WP source, auto-trading or payment Cron before live parity verification."
