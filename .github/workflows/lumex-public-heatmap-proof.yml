name: LUMEX free heatmap production evidence
on:
  pull_request:
    paths:
      - '.github/workflows/lumex-public-heatmap-proof.yml'
  push:
    paths:
      - '.github/workflows/lumex-public-heatmap-proof.yml'
permissions:
  contents: read
jobs:
  verify-public-heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prove real public top-50 R2 snapshot, not a stub
        run: |
          python3 - <<'PY'
          import datetime,json,time,urllib.request,urllib.error
          url='https://lumex-ai-research2.kpiplus195.workers.dev/market-hub/v1/public-heatmap'
          for attempt in range(22):
              try:
                  req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'LUMEX-public-proof'})
                  with urllib.request.urlopen(req,timeout=15) as r: data=json.load(r)
                  coins=data.get('coins')
                  assert r.status==200 and data.get('ok') is True and data.get('schema')=='lumex_public_heatmap_v1'
                  assert len(coins)==50 and data.get('breadth',{}).get('total')==50
                  assert len({c['symbol'] for c in coins})==50
                  assert data.get('selection')=='same_exchange_top50_by_24h_quote_turnover'
                  assert not data.get('stale')
                  print('HEATMAP_REAL_PUBLIC_PROOF '+json.dumps({'ok':True,'checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':data['source'],'collected_ms':data['collected_ms'],'n':len(coins),'breadth':data['breadth'],'first4':[{'coin':c['coin'],'change_24h_pct':c['change_24h_pct']} for c in coins[:4]],'stale':data['stale']}))
                  break
              except Exception as e:
                  print('public_heatmap_proof_pending',attempt+1,str(e).replace('\n',' ')[:110])
                  if attempt==21:raise SystemExit('FIRST_LIVE_PUBLIC_HEATMAP_NOT_VERIFIED')
                  time.sleep(14)
          PY
