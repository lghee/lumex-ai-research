name: diag stock candles (temporary)
on:
  push:
    branches: [diag/stock-candles-20261127]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://lumex-ai-research2.kpiplus195.workers.dev/stock-hub/v1
          sleep 330
          echo "== status"; curl -s -m 25 "$B/status" | head -c 900; echo
          echo "== daily-index"; curl -s -m 25 "$B/daily-index" | head -c 400; echo
          echo "== daily 2026-11-27"; curl -s -m 25 -o /dev/null -w '%{http_code}\n' "$B/daily?date=2026-11-27"
          echo "== whales"; curl -s -m 25 "$B/whales" | python3 -c "import sys,json;j=json.load(sys.stdin);print('events',len(j.get('events',[])))"
