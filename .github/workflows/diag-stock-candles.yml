name: diag stock candles (temporary)
on:
  push:
    branches: [diag/stock-candles-20261127]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://lumex-ai-research2.kpiplus195.workers.dev/stock-hub/v1
          curl -s -m 25 "$B/radar" | python3 -c "
          import sys,json
          j=json.load(sys.stdin);it=j.get('items') or [];print('ok',j.get('ok'),'items',len(it),'ranked',sum(1 for x in it if x.get('ranked')),'updated',j.get('updated_ms'))
          print(sorted(it[0].keys()) if it else None)
          r=sorted([x for x in it if x.get('ranked')],key=lambda x:-(x.get('turnover_24h_usd') or 0))[:10];print([x['symbol'] for x in r])"
          curl -s -m 25 "$B/status" | head -c 1500; echo
          curl -s -m 25 "https://lumex-ai-research2.kpiplus195.workers.dev/health" | head -c 400; echo
