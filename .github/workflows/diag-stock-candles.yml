name: diag stock candles (temporary)
on:
  push:
    branches: [diag/stock-candles-20261127]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in "" news/ news/report/2026-11-28/ daily/ market/ stocks/ guide/ tools/ calendar/ learn/; do
            echo "=== /$p"; curl -s -m 30 -A 'Mozilla/5.0' "https://lumexbot.com/$p" -o /tmp/p.html -w 'HTTP %{http_code}\n'
            python3 - <<'PY'
          import re,html
          t=open('/tmp/p.html',encoding='utf-8',errors='ignore').read()
          side=re.findall(r'class="lx-side-link[^"]*"\s+href="([^"]+)"[^>]*>.*?<span>([^<]*)</span>',t,re.S)
          print('SIDE',[(h.replace('https://lumexbot.com',''),l) for h,l in side])
          tabs=re.search(r'<nav class="ds-tabs".*?</nav>',t,re.S)
          if tabs: print('TABS',[(h.replace('https://lumexbot.com',''),html.unescape(l)) for h,l in re.findall(r'href="([^"]+)"[^>]*>([^<]+)</a>',tabs.group(0))])
          dock=re.search(r'class="lx-mobile-dock.*?</nav>',t,re.S)
          if dock: print('DOCK',[h.replace('https://lumexbot.com','') for h in re.findall(r'href="([^"]+)"',dock.group(0))])
          print('KICK',re.findall(r'lx-side-kicker[^>]*>([^<]+)<',t))
          PY
          done
