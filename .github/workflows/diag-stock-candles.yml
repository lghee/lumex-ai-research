name: diag stock candles (temporary)
on:
  push:
    branches: [diag/stock-candles-20261127]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://lumex-ai-research2.kpiplus195.workers.dev/stock-hub/v1
          date -u
          echo "== scan-status"; curl -s -m 25 "$B/scan-status"; echo
          echo "== scan no token"; curl -s -m 25 -o /dev/null -w '%{http_code}\n' "$B/scan"
          echo "== bots"; curl -s -m 25 "$B/bots" | head -c 300; echo
