name: diag stock candles (temporary)
on:
  push:
    branches: [diag/stock-candles-20261127]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://lumex-ai-research2.kpiplus195.workers.dev/stock-hub/v1
          for round in 1 2; do
            echo "== round $round"; curl -s -m 25 "$B/status"; echo
            for p in "candles?symbol=NVDAUSDT&interval=60" "candles?symbol=TSLAUSDT&interval=60" "candles?symbol=NVDAUSDT&interval=15" "candles?symbol=ORCLUSDT&interval=D"; do
              echo "-- $p"; curl -s -m 25 "$B/$p" | python3 -c "import sys,json;j=json.load(sys.stdin);print({k:j.get(k) for k in ('ok','error','source_error','origin','as_of_ms','retrieved_ms')},len(j.get('bars') or []))"; done
            [ $round = 1 ] && sleep 330
          done
