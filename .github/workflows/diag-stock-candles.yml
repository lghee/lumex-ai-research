name: diag stock candles (temporary)
on:
  push:
    branches: [diag/stock-candles-20261127]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://lumex-ai-research2.kpiplus195.workers.dev/stock-hub/v1
          for q in "NVDAUSDT&interval=60" "NVDAUSDT&interval=240" "TSLAUSDT&interval=60" "SPYUSDT&interval=60"; do
            echo "== $q"; curl -s -m 25 "$B/candles?symbol=$q" | python3 -c "
          import sys,json,collections
          j=json.load(sys.stdin);b=j.get('bars') or [];print('ok',j.get('ok'),j.get('error'),'n',len(b),'origin',j.get('origin'))
          if b:
            import datetime
            d=collections.Counter((b[i]['t']-b[i-1]['t'])//60000 for i in range(1,len(b)));print('gaps(min):',dict(d))
            print('first',datetime.datetime.utcfromtimestamp(b[0]['t']/1000),'last',datetime.datetime.utcfromtimestamp(b[-1]['t']/1000))
            big=[(datetime.datetime.utcfromtimestamp(b[i-1]['t']/1000).isoformat(),(b[i]['t']-b[i-1]['t'])//60000) for i in range(1,len(b)) if b[i]['t']-b[i-1]['t']>3600000*4]
            print('big gaps',big[:8]); zero=sum(1 for x in b if x['v']==0); print('zero-volume bars',zero)
          "; done
          echo "== whale detail probe"; A=$(curl -s -m 25 "$B/whales" | python3 -c "import sys,json;j=json.load(sys.stdin);print(j['positions'][0]['address'])"); echo $A
          curl -s -m 20 -X POST https://api.hyperliquid.xyz/info -H 'content-type: application/json' -d "{\"type\":\"clearinghouseState\",\"user\":\"$A\",\"dex\":\"xyz\"}" | head -c 1500; echo
          curl -s -m 20 -X POST https://api.hyperliquid.xyz/info -H 'content-type: application/json' -d "{\"type\":\"userFillsByTime\",\"user\":\"$A\",\"startTime\":$(( ($(date +%s)-7*86400)*1000 ))}" | python3 -c "import sys,json;f=json.load(sys.stdin);print('fills',len(f));x=[a for a in f if str(a.get('coin','')).startswith('xyz:')];print('xyz fills',len(x));print(json.dumps(x[:2]))"
